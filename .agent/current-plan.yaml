plan:
  objective: Deliver a reversible and independently verifiable Windows Codex skill installer.
  tasks:
    - id: T1
      task: Define destination safety, backup, rollback, and verification contracts.
      output: CHANGE-002 and installer behavior contract.
      verify: Existing installation and project layout are inspected.
      status: completed
    - id: T2
      task: Implement the native PowerShell installer and automated tests.
      output: scripts/install-skill.ps1 plus focused tests and documentation.
      verify: Temporary-destination install and replacement scenarios pass.
      status: completed
    - id: T3
      task: Reinstall the real Codex skill with backup and hash verification.
      output: Verified user-level Codex skill and recoverable backup.
      verify: Relative file sets and every SHA-256 digest match.
      status: completed
    - id: T4
      task: Protect the release baseline and publish.
      output: Full gates, updated Baseline, commit, push, and remote CI.
      verify: Local and GitHub Actions checks pass.
      status: in_progress
